[package]
name = "nexushub-desktop"
version = "1.3.10"
description = "NexusHub macOS desktop console"
authors = ["NexusHub contributors"]
license = "MIT"
repository = "https://github.com/lich13/nexushub"
edition = "2021"
rust-version = "1.99"
default-run = "nexushub"
autobins = false

[workspace]

[lib]
name = "nexushub_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
doctest = false

[[bin]]
name = "nexushub"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.4.0", features = [] }

[dependencies]
anyhow = "1.0"
chrono = "0.4"
dirs = "5.0"
nexushub-core = { path = "../crates/nexushub-core" }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.8.2", features = [] }
tauri-plugin-opener = "2"
# Only macOS is distributed. Its tar.gz updater is unconditional; the default
# `zip` feature additionally pulls in an unused Windows ZIP extractor.
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1.37", features = ["rt-multi-thread"] }
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSData", "NSDictionary", "NSString"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSPasteboard", "NSPasteboardItem", "NSBitmapImageRep", "NSImageRep"] }

[dev-dependencies]
tokio = { version = "1.37", features = ["test-util"] }
tempfile = "3"
