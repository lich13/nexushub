name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.8
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Get pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(corepack pnpm@11.0.8 store path --silent)" >> "${GITHUB_OUTPUT}"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-v1-pnpm-${{ hashFiles('webui/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-v1-pnpm-
      - run: corepack pnpm@11.0.8 --dir webui install --frozen-lockfile
      - run: corepack pnpm@11.0.8 --dir webui typecheck
      - run: corepack pnpm@11.0.8 --dir webui test
      - run: corepack pnpm@11.0.8 --dir webui build
      - run: corepack pnpm@11.0.8 --dir webui exec playwright install --with-deps chromium webkit
      - run: corepack pnpm@11.0.8 --dir webui test:browser
        env:
          NEXUSHUB_TEST_OUTPUT: ${{ runner.temp }}/nexushub-browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: frontend-browser-failures
          path: ${{ runner.temp }}/nexushub-browser

  backend:
    name: Backend checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-v1-cargo-backend-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-v1-cargo-backend-
      - run: python3 scripts/privacy-check.py --git-objects
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: bash scripts/test-install-script.sh

  tauri:
    name: macOS Tauri checks
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.8
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Get pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(corepack pnpm@11.0.8 store path --silent)" >> "${GITHUB_OUTPUT}"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-v1-pnpm-${{ hashFiles('webui/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-v1-pnpm-
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            src-tauri/target
          key: ${{ runner.os }}-v1-cargo-tauri-${{ hashFiles('Cargo.lock', 'src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-v1-cargo-tauri-
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: corepack pnpm@11.0.8 --dir webui install --frozen-lockfile
      - run: corepack pnpm@11.0.8 --dir webui test
      - run: corepack pnpm@11.0.8 --dir webui build:tauri
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
