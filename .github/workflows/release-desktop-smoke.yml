name: Released desktop smoke

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact published release tag
        required: true
        type: string

permissions:
  contents: read

jobs:
  linux:
    name: Exact-tag Linux AppImage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install desktop rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xdotool python3-gi python3-pil fonts-noto-cjk libgtk-3-0t64 libwebkit2gtk-4.1-0 libayatana-appindicator3-1
      - name: Download and verify published AppImage
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          asset="NexusHub-${RELEASE_TAG#v}-Linux-x86_64.AppImage"
          mkdir -p "$RUNNER_TEMP/released-desktop"
          gh release download "$RELEASE_TAG" --pattern "$asset" --pattern "$asset.sha256" --dir "$RUNNER_TEMP/released-desktop"
          cd "$RUNNER_TEMP/released-desktop"
          sha256sum -c "$asset.sha256"
          chmod +x "$asset"
          xvfb-run -a -s "-screen 0 1440x900x24" /usr/bin/python3 "$GITHUB_WORKSPACE/scripts/smoke-linux-tauri.py" "$asset" "$RUNNER_TEMP/linux-tauri-smoke"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: released-linux-tauri-smoke
          path: ${{ runner.temp }}/linux-tauri-smoke
